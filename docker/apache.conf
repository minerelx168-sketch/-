# Apache vhost for the imeihub dev container.
#
# Default site is the project root. AllowOverride All so any future
# .htaccess can drop in rewrite rules without touching this file.
# Errors go to the container's stdout/stderr (visible in
# `docker compose logs app`).

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        # PHP front-controller style: pretty paths fall back to .php.
        # /dashboard -> /dashboard.php
        # /api/check -> /api/check.php
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^([^/.]+)$ $1.php [L]
        RewriteRule ^(api/[^/]+)/([^/]+)$ $1/$2.php [L]

        # Block direct access to anything sensitive.
        <FilesMatch "(\.env|\.git|composer\.|README|DOCKER\.md)">
            Require all denied
        </FilesMatch>
    </Directory>

    # Protect /sql and /docker config from being served.
    <DirectoryMatch "/(sql|docker|scripts)(/|$)">
        Require all denied
    </DirectoryMatch>

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
